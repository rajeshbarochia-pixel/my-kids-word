<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Vision Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#f0f4f8;margin:0;padding:15px}
h2{color:#1a365d}
button{background:#3182ce;color:white;padding:14px 24px;font-size:18px;border:0;border-radius:8px;margin:8px}
button:disabled{background:#999}
#webcam-container{margin:15px auto;border:3px solid #3182ce;border-radius:12px;overflow:hidden;width:min(90vw,400px);background:#222}
#webcam-container canvas{display:block;width:100%!important;height:auto!important}
#label-container{font-size:20px;font-weight:bold;margin-top:15px;color:#2d3748}
#status{margin:10px;color:#555}
</style>
</head>
<body>
<h2>દ્રષ્ટિહીન લોકો માટે Smart AI Assistant</h2>
<p id="status">AI મોડેલ તૈયાર છે.</p>
<button id="startBtn" onclick="init()">AI કેમેરા શરૂ કરો</button>
<button id="stopBtn" onclick="stopCamera()" disabled>કેમેરો બંધ કરો</button>
<div id="webcam-container"></div>
<div id="label-container">કેમેરા શરૂ કરવાની રાહ જોઈ રહ્યા છીએ...</div>
<script>
const URL="https://teachablemachine.withgoogle.com/models/ZG5RraO1m/";
let model=null,webcam=null,maxPredictions=0,running=false;
let lastSpokenText="",lastSpokenTime=0;

async function init(){
 const status=document.getElementById("status"),label=document.getElementById("label-container");
 const startBtn=document.getElementById("startBtn"),stopBtn=document.getElementById("stopBtn");
 try{
  startBtn.disabled=true; status.textContent="AI મોડેલ લોડ થઈ રહ્યું છે...";
  model=await tmImage.load(URL+"model.json",URL+"metadata.json");
  maxPredictions=model.getTotalClasses();
  status.textContent="કેમેરાની પરવાનગી માંગવામાં આવી રહી છે...";
  webcam=new tmImage.Webcam(320,320,false);
  try{await webcam.setup({facingMode:{exact:"environment"}})}
  catch(e){try{await webcam.setup({facingMode:"environment"})}catch(e2){await webcam.setup()}}
  await webcam.play();
  document.getElementById("webcam-container").innerHTML="";
  document.getElementById("webcam-container").appendChild(webcam.canvas);
  running=true;stopBtn.disabled=false;
  status.textContent="AI કેમેરા ચાલુ છે";label.textContent="વસ્તુ કેમેરા સામે લાવો...";
  speakText("AI કેમેરા ચાલુ છે");
  requestAnimationFrame(loop);
 }catch(error){
  console.error(error);status.textContent="કેમેરા અથવા મોડેલ શરૂ થઈ શક્યું નથી.";
  label.textContent="કેમેરા શરૂ કરવામાં સમસ્યા આવી.";startBtn.disabled=false;
  alert("કેમેરા શરૂ થઈ શક્યો નથી. Camera Permissionમાં Allow કરો અને HTML ફાઇલ HTTPS વેબસાઇટ પરથી ખોલો.");
 }
}

async function loop(){
 if(!running||!webcam)return;
 webcam.update();await predict();if(running)requestAnimationFrame(loop);
}

async function predict(){
 if(!model||!webcam)return;
 try{
  const prediction=await model.predict(webcam.canvas);
  let highestProb=0,bestMatch="";
  for(let i=0;i<maxPredictions;i++){
   if(prediction[i].probability>highestProb){
    highestProb=prediction[i].probability;bestMatch=prediction[i].className;
   }
  }
  if(highestProb>=0.85){
   document.getElementById("label-container").textContent="સામે છે: "+bestMatch+" ("+Math.round(highestProb*100)+"%)";
   speakText(bestMatch);
  }else document.getElementById("label-container").textContent="વસ્તુ ઓળખાઈ રહી છે...";
 }catch(error){console.error("Prediction error:",error)}
}

function speakText(text){
 if(!("speechSynthesis" in window))return;
 const now=Date.now();
 if(text!==lastSpokenText||now-lastSpokenTime>3000){
  speechSynthesis.cancel();
  const speech=new SpeechSynthesisUtterance("સામે "+text+" છે");
  speech.lang="gu-IN";speech.rate=.9;speechSynthesis.speak(speech);
  lastSpokenText=text;lastSpokenTime=now;
 }
}

function stopCamera(){
 running=false;
 if(webcam){try{webcam.stop()}catch(e){}}
 speechSynthesis.cancel();
 document.getElementById("webcam-container").innerHTML="";
 document.getElementById("label-container").textContent="કેમેરો બંધ છે.";
 document.getElementById("status").textContent="કેમેરો બંધ કરવામાં આવ્યો.";
 document.getElementById("startBtn").disabled=false;
 document.getElementById("stopBtn").disabled=true;
}
</script>
</body>
</html>
